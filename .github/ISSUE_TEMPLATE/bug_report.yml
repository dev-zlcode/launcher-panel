name: 反馈 Bug
description: 界面不对、点了没反应、请求报错、构建失败
title: "[bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        这个面板的失败点分得很细：校验拦下来、解析链掉了一层、前端回落默认值，三种看起来都像"坏了"，
        但根因完全不同。**没有下面标红的几样，我基本没法判断是哪一种。**

  - type: dropdown
    id: surface
    attributes:
      label: 哪个界面
      description: 一个界面一个 issue；两处都坏就提两次（同一个根因我会自己关重复的）
      options:
        - 面板 /（卡片、搜索、侧栏筛选、⌘K）
        - 设置弹窗 ⌘,（打开方式 / 终端 / 扫描路径 / 失效引用）
        - 打开方式或终端菜单（右键、双击、「打开方式…」）
        - 发现导入
        - 应用管理 /manage.html
        - 服务端 /api/*
        - 起服务 / 构建
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: 哪类条目
      description: 六类里的那一类；和应用/条目无关就选最后一项
      multiple: true
      options:
        - app 应用
        - folder 文件夹
        - file 文件
        - url 链接
        - snippet 片段
        - command 命令
        - 与条目无关
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 现象与期望
      description: 你做了什么 → 看到什么 → 你以为该看到什么。别只写"打不开"
      placeholder: |
        单击一个 folder 条目，卡片上的默认应用徽标显示「系统默认」，
        但设置里 folder 类型的打开方式第一项是 /Applications/Finder.app。
        期望：按类型配置的默认应用生效。
    validations:
      required: true

  - type: textarea
    id: request
    attributes:
      label: 你发的请求
      description: 实际打出去的那个 HTTP 请求（方法、路径、请求体），或点按钮时的操作序列
      render: shell
      placeholder: |
        curl -s -X PATCH http://127.0.0.1:5178/api/settings \
          -H 'content-type: application/json' \
          -d '{"openByKind":{"folder":["/Applications/Finder.app"]}}'
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: 状态码和 error 原文
      description: 照抄，不要转述。中文文案差一个字指向的分支就不一样
      placeholder: |
        HTTP 400
        {"error":"每类的打开方式需要是应用数组，第一个为默认"}
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: 环境
      description: Node 版本、macOS 版本、跑的是 dev 还是 prod
      placeholder: |
        node -v  → v24.18.0
        sw_vers -productVersion → 26.6
        npm run dev / npm start / 其他
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志（可选）
      description: 服务端控制台输出、浏览器 console 报错

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 上面没有真实路径、真实条目内容或 `data/items.json` 片段（要举例请用假路径）
          required: true
        - label: 我没有手改过 `data/items.json`（改过的话请先用接口重放一次再判断是否还在）
          required: true
        - label: 我读过 CONTRIBUTING 的「硬约束」，这不是"应该顺手改进"那一类
          required: true
